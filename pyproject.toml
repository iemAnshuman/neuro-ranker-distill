[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-ranker-distill"
version = "0.2.0"
description = "Reproducible cross-encoder to bi-encoder distillation on MS MARCO"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {file = "LICENSE"}
authors = [{name = "Anshuman Agrawal"}]
dependencies = [
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
train = [
    "torch>=2.7,<2.8",
    "transformers>=4.48,<5",
    "tqdm>=4.66,<5",
]
export = [
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<2",
]
service = [
    "fastapi>=0.115,<1",
    "onnxruntime>=1.20,<2",
    "transformers>=4.48,<5",
    "uvicorn>=0.34,<1",
]
test = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
]
dev = [
    "ruff>=0.11,<1",
]

[project.scripts]
neuro-ranker = "neuro_ranker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
